<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@400;500;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chassis-1: #3E4C55;
    --chassis-2: #29343B;
    --display-bg: #101A1C;
    --display-edge: #0A1213;

    --c-number:  #FFC876;
    --c-operator:#4FD6C6;
    --c-func:    #C6B4FF;
    --c-ans:     #FF8FB1;
    --c-muted:   #6E8A8F;

    --key-num: #ECF1F2;
    --key-num-text: #1C262A;
    --key-fn: #46585F;
    --key-fn-text: #E7EEEF;
    --key-fn2: #3A4A52;
    --key-fn2-text: #BFD0D4;
    --key-op: #2FAE9F;
    --key-op-text: #06231F;
    --key-eq: #FFB454;
    --key-eq-text: #2C1F04;
    --key-shift: #E0A63A;
    --key-shift-text: #2C1F04;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0C1214;
    font-family: 'Sora', sans-serif;
    padding: 28px 14px;
  }

  .calc{
    width: min(420px, 96vw);
    background: linear-gradient(180deg, var(--chassis-1) 0%, var(--chassis-2) 100%);
    border-radius: 22px;
    padding: 18px 14px 20px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.65),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .brand{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px 12px;
  }
  .brand-name{
    font-size: 11px;
    letter-spacing: 3px;
    color: #B7C4C8;
    font-weight: 600;
    text-transform: uppercase;
  }
  .brand-model{
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: #7C9096;
    letter-spacing: 1px;
  }

  .screen{
    background: var(--display-bg);
    border-radius: 12px;
    padding: 16px 16px 14px;
    margin-bottom: 16px;
    box-shadow: inset 0 3px 10px rgba(0,0,0,0.55), inset 0 0 0 1px var(--display-edge);
    position: relative;
  }

  .status-row{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    height: 14px;
  }
  .status-tags{
    display: flex;
    gap: 10px;
  }
  .tag{
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--c-muted);
    opacity: 0.4;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .tag.on{ opacity: 1; color: var(--c-operator); }
  .tag.shift-on{ color: var(--key-shift); }

  .history{
    font-family: 'Space Mono', monospace;
    font-size: clamp(12px, 2.2vw, 15px);
    min-height: 20px;
    line-height: 1.2;
    text-align: right;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    margin-bottom: 6px;
  }
  .history::-webkit-scrollbar{ display: none; }

  .result-row{
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 6px;
    min-height: 46px;
  }
  .result{
    font-family: 'Orbitron', 'Space Mono', monospace;
    font-size: clamp(24px, 6vw, 40px);
    font-weight: 700;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 0 18px currentColor, 0 2px 0 rgba(0,0,0,0.45);
  }
  .sign-pos{ color: var(--c-operator); }
  .sign-neg{ color: #FF7A6B; }
  .sign-neutral{ color: var(--c-number); }
  .result.is-ans{ color: var(--c-ans); }

  .num-token{ color: var(--c-number); }
  .op-token{ color: var(--c-operator); }
  .func-token{ color: var(--c-func); }
  .ans-token{ color: var(--c-ans); font-weight: 700; }

  .pad{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(56px, 1fr));
    gap: 8px;
  }

  button{
    border: none;
    border-radius: 9px;
    font-family: 'Sora', sans-serif;
    font-size: clamp(12px, 1.6vw, 16px);
    font-weight: 600;
    padding: clamp(8px, 2.2vw, 12px) 0;
    cursor: pointer;
    user-select: none;
    transition: transform 0.06s ease, box-shadow 0.06s ease, filter 0.15s ease;
    box-shadow: 0 3px 0 rgba(0,0,0,0.28), 0 4px 6px rgba(0,0,0,0.2);
    white-space: nowrap;
  }
  button:active{
    transform: translateY(3px);
    box-shadow: 0 0 0 rgba(0,0,0,0.28);
  }
  button sup{ font-size: 10px; }

  .key-num{ background: var(--key-num); color: var(--key-num-text); font-size: 16px; }
  .key-num:hover{ filter: brightness(0.96); }

  .key-fn{ background: var(--key-fn); color: var(--key-fn-text); font-size: 13px; }
  .key-fn:hover{ filter: brightness(1.12); }

  .key-fn2{ background: var(--key-fn2); color: var(--key-fn2-text); font-size: 13px; }
  .key-fn2:hover{ filter: brightness(1.15); }

  .key-op{ background: var(--key-op); color: var(--key-op-text); font-size: 17px; }
  .key-op:hover{ filter: brightness(1.08); }

  .key-eq{ background: var(--key-eq); color: var(--key-eq-text); font-size: 17px; }
  .key-eq:hover{ filter: brightness(1.06); }

  .key-shift{ background: var(--key-shift); color: var(--key-shift-text); }
  .key-shift.active{ box-shadow: 0 0 0 2px #fff5, 0 3px 0 rgba(0,0,0,0.28); }

  .key-ac{ background: #C4574A; color: #fff; }
  .key-ac:hover{ filter: brightness(1.1); }

  .key-zero{ grid-column: span 2; }
  .key-eq.key-wide{ grid-column: span 2; }

  .pressed-flash{ animation: flash 0.22s ease; }
  @keyframes flash{ 0%{ filter: brightness(1.35); } 100%{ filter: brightness(1); } }

  @media (max-width: 430px){
    .calc{ width: 100%; max-width: 420px; padding: 14px 10px 16px; }
    .result{ font-size: clamp(20px, 8vw, 32px); }
    button{ font-size: clamp(11px, 2.6vw, 13px); padding: 10px 0; }
  }

  /* small digital-look tweaks */
  .screen{
    background: linear-gradient(180deg, #071012 0%, var(--display-bg) 100%);
    border-radius: 10px;
    padding: 12px 12px 10px;
    box-shadow: inset 0 6px 20px rgba(12,20,22,0.6), inset 0 0 0 1px var(--display-edge);
  }

  .result{ letter-spacing: 1px; }
</style>
</head>
<body>

<div class="calc">
  <div class="brand">
    <span class="brand-name">Calc Lab</span>
    <span class="brand-model">SCI &middot; 82</span>
  </div>

  <div class="screen">
    <div class="status-row">
      <div class="status-tags">
        <span class="tag shift-on" id="tag-shift">SHIFT</span>
        <span class="tag" id="tag-deg">DEG</span>
        <span class="tag" id="tag-rad">RAD</span>
      </div>
      <span class="tag" id="tag-ans">ANS</span>
    </div>
    <div class="history" id="history">&nbsp;</div>
    <div class="result-row">
      <span class="result sign-neutral" id="result">0</span>
    </div>
  </div>

  <div class="pad">
    <button class="key-shift" id="shiftBtn">SHIFT</button>
    <button class="key-fn2" data-action="mode">DEG/RAD</button>
    <button class="key-fn2" data-action="paren-open">(</button>
    <button class="key-fn2" data-action="paren-close">)</button>
    <button class="key-ac" data-action="clear">AC</button>

    <button class="key-fn" data-trig="sin">sin</button>
    <button class="key-fn" data-trig="cos">cos</button>
    <button class="key-fn" data-trig="tan">tan</button>
    <button class="key-fn" data-action="log">log</button>
    <button class="key-fn" data-action="del">DEL</button>

    <button class="key-fn" data-action="sqrt">&radic;x</button>
    <button class="key-fn" data-action="sq">x<sup>2</sup></button>
    <button class="key-fn" data-action="cube">x<sup>3</sup></button>
    <button class="key-fn" data-action="pow">x<sup>y</sup></button>
    <button class="key-fn" data-action="inv">1/x</button>

    <button class="key-fn2" data-action="pi">&pi;</button>
    <button class="key-fn2" data-action="euler">e</button>
    <button class="key-fn2" data-action="ln">ln</button>
    <button class="key-fn2" data-action="fact">x!</button>
    <button class="key-fn2" data-action="ans">Ans</button>

    <button class="key-num" data-num="7">7</button>
    <button class="key-num" data-num="8">8</button>
    <button class="key-num" data-num="9">9</button>
    <button class="key-op" data-op="/">&divide;</button>
    <button class="key-op" data-action="percent">%</button>

    <button class="key-num" data-num="4">4</button>
    <button class="key-num" data-num="5">5</button>
    <button class="key-num" data-num="6">6</button>
    <button class="key-op" data-op="*">&times;</button>
    <button class="key-op" data-action="negate">+/&minus;</button>

    <button class="key-num" data-num="1">1</button>
    <button class="key-num" data-num="2">2</button>
    <button class="key-num" data-num="3">3</button>
    <button class="key-op" data-op="-">&minus;</button>
    <button class="key-eq" data-action="equals" style="grid-row: span 2;">=</button>

    <button class="key-num key-zero" data-num="0">0</button>
    <button class="key-num" data-action="decimal">.</button>
    <button class="key-op" data-op="+">+</button>
  </div>
</div>

<script>
(function(){
  const historyEl = document.getElementById('history');
  const resultEl = document.getElementById('result');
  const tagShift = document.getElementById('tag-shift');
  const tagDeg = document.getElementById('tag-deg');
  const tagRad = document.getElementById('tag-rad');
  const tagAns = document.getElementById('tag-ans');
  const shiftBtn = document.getElementById('shiftBtn');

  let expr = '';
  let ans = 0;
  let hasAns = false;
  let shift = false;
  let degMode = true;
  let justEvaluated = false;

  const opColor = { '+':'op-token', '-':'op-token', '*':'op-token', '/':'op-token', '^':'op-token', '%':'op-token', '!':'op-token' };
  const funcNames = ['sin','cos','tan','asin','acos','atan','log','ln','sqrt'];

  function updateTags(){
    tagShift.classList.toggle('on', shift);
    tagDeg.classList.toggle('on', degMode);
    tagRad.classList.toggle('on', !degMode);
    tagAns.classList.toggle('on', hasAns);
    shiftBtn.classList.toggle('active', shift);
  }

  function colorizeExpr(str){
    const tokens = str.match(/Ans|asin|acos|atan|sin|cos|tan|log|ln|sqrt|\d+\.?\d*|\.\d+|\u03c0|e|[+\-*/^%!()]/g) || [];
    return tokens.map(t=>{
      if (t === 'Ans') return '<span class="ans-token">Ans</span>';
      if (funcNames.includes(t)) return '<span class="func-token">' + t + '</span>';
      if (t === '\u03c0' || t === 'e') return '<span class="func-token">' + t + '</span>';
      if (/^[+\-*/^%!]$/.test(t)) return '<span class="op-token">' + displayOp(t) + '</span>';
      if (t === '(' || t === ')') return '<span class="op-token">' + t + '</span>';
      return '<span class="num-token">' + t + '</span>';
    }).join('');
  }

  function displayOp(t){
    return { '+':'+', '-':'\u2212', '*':'\u00d7', '/':'\u00f7', '^':'^', '%':'%', '!':'!' }[t] || t;
  }

  function render(liveResult){
    historyEl.innerHTML = expr ? colorizeExpr(expr) : '&nbsp;';
    resultEl.classList.remove('sign-pos','sign-neg','sign-neutral','is-ans');

    if (liveResult && liveResult.ok){
      const v = liveResult.value;
      resultEl.textContent = formatNumber(v);
      if (v > 0) resultEl.classList.add('sign-pos');
      else if (v < 0) resultEl.classList.add('sign-neg');
      else resultEl.classList.add('sign-neutral');
    } else if (liveResult && !liveResult.ok && expr){
      resultEl.textContent = 'Error';
      resultEl.classList.add('sign-neg');
    } else {
      resultEl.textContent = '0';
      resultEl.classList.add('sign-neutral');
    }
    updateTags();
  }

  function formatNumber(num){
    if (!isFinite(num)) return 'Error';
    let str;
    if (Math.abs(num) >= 1e12 || (Math.abs(num) < 1e-9 && num !== 0)){
      str = num.toExponential(6).replace(/e\+?/, 'E');
    } else {
      str = parseFloat(num.toPrecision(11)).toString();
    }
    return str;
  }

  // ---------- Parser ----------
  function tokenize(str){
    const re = /Ans|asin|acos|atan|sin|cos|tan|log|ln|sqrt|\d+\.?\d*|\.\d+|\u03c0|e|[+\-*/^%!()]/g;
    return str.match(re) || [];
  }

  function evaluate(str){
    try{
      const tokens = tokenize(str);
      let pos = 0;

      function peek(){ return tokens[pos]; }
      function next(){ return tokens[pos++]; }

      function parseExpr(){
        let v = parseTerm();
        while (peek() === '+' || peek() === '-'){
          const op = next();
          const r = parseTerm();
          v = op === '+' ? v + r : v - r;
        }
        return v;
      }
      function parseTerm(){
        let v = parseUnary();
        while (peek() === '*' || peek() === '/' || peek() === '%'){
          const op = next();
          if (op === '%'){ v = v / 100; continue; }
          const r = parseUnary();
          v = op === '*' ? v * r : v / r;
        }
        return v;
      }
      function parseUnary(){
        if (peek() === '-'){ next(); return -parseUnary(); }
        if (peek() === '+'){ next(); return parseUnary(); }
        return parsePower();
      }
      function parsePower(){
        let v = parsePostfix();
        if (peek() === '^'){
          next();
          const r = parseUnary();
          v = Math.pow(v, r);
        }
        return v;
      }
      function parsePostfix(){
        let v = parsePrimary();
        while (peek() === '!'){
          next();
          v = factorial(v);
        }
        return v;
      }
      function toRad(v){ return degMode ? v * Math.PI / 180 : v; }
      function fromRad(v){ return degMode ? v * 180 / Math.PI : v; }

      function parsePrimary(){
        const t = next();
        if (t === undefined) throw new Error('unexpected end');
        if (t === '('){
          const v = parseExpr();
          if (peek() === ')') next();
          return v;
        }
        if (t === 'Ans') return hasAns ? ans : 0;
        if (t === '\u03c0') return Math.PI;
        if (t === 'e') return Math.E;
        if (funcNames.includes(t)){
          let arg;
          if (peek() === '(') { next(); arg = parseExpr(); if (peek() === ')') next(); }
          else arg = parseUnary();
          switch(t){
            case 'sin': return Math.sin(toRad(arg));
            case 'cos': return Math.cos(toRad(arg));
            case 'tan': return Math.tan(toRad(arg));
            case 'asin': return fromRad(Math.asin(arg));
            case 'acos': return fromRad(Math.acos(arg));
            case 'atan': return fromRad(Math.atan(arg));
            case 'log': return Math.log10(arg);
            case 'ln': return Math.log(arg);
            case 'sqrt': return Math.sqrt(arg);
          }
        }
        if (/^[\d.]/.test(t)) return parseFloat(t);
        throw new Error('bad token ' + t);
      }

      function factorial(n){
        n = Math.round(n);
        if (n < 0) return NaN;
        let r = 1;
        for (let i = 2; i <= n; i++) r *= i;
        return r;
      }

      const v = parseExpr();
      if (pos !== tokens.length) throw new Error('trailing tokens');
      if (isNaN(v)) return { ok:false };
      return { ok:true, value:v };
    } catch(e){
      return { ok:false };
    }
  }

  // ---------- Input handling ----------
  function append(str){
    if (justEvaluated){
      if (/^[0-9.(]/.test(str) || funcNames.includes(str.replace('(',''))){
        expr = '';
      }
      justEvaluated = false;
    }
    expr += str;
    live();
  }

  function live(){
    if (!expr){ render(null); return; }
    const r = evaluate(expr);
    render(r);
  }

  function clearAll(){
    expr = '';
    justEvaluated = false;
    render(null);
  }

  function del(){
    if (justEvaluated){ clearAll(); return; }
    // remove one logical token from the end (function names count as one unit)
    const funcMatch = expr.match(/(asin|acos|atan|sin|cos|tan|log|ln|sqrt)\($/);
    if (funcMatch){
      expr = expr.slice(0, -funcMatch[0].length);
    } else {
      expr = expr.slice(0, -1);
    }
    live();
  }

  function equals(){
    if (!expr) return;
    const r = evaluate(expr);
    if (r.ok){
      ans = r.value;
      hasAns = true;
      historyEl.innerHTML = colorizeExpr(expr) + '<span class="op-token"> =</span>';
      resultEl.textContent = formatNumber(r.value);
      resultEl.classList.remove('sign-pos','sign-neg','sign-neutral');
      resultEl.classList.add(r.value > 0 ? 'sign-pos' : r.value < 0 ? 'sign-neg' : 'sign-neutral');
      resultEl.classList.add('is-ans');
      expr = formatNumber(r.value);
      justEvaluated = true;
      updateTags();
    } else {
      resultEl.textContent = 'Error';
      resultEl.classList.remove('sign-pos','sign-neutral');
      resultEl.classList.add('sign-neg');
    }
  }

  function flash(el){
    if (!el) return;
    el.classList.remove('pressed-flash');
    void el.offsetWidth;
    el.classList.add('pressed-flash');
  }

  document.querySelectorAll('[data-num]').forEach(btn=>{
    btn.addEventListener('click', ()=> append(btn.dataset.num));
  });
  document.querySelectorAll('[data-op]').forEach(btn=>{
    btn.addEventListener('click', ()=> append(btn.dataset.op));
  });
  document.querySelectorAll('[data-trig]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const base = btn.dataset.trig;
      const name = shift ? ('a' + base) : base;
      append(name + '(');
      if (shift){ shift = false; updateTags(); }
    });
  });

  shiftBtn.addEventListener('click', ()=>{ shift = !shift; updateTags(); });

  document.querySelector('[data-action="clear"]').addEventListener('click', clearAll);
  document.querySelector('[data-action="del"]').addEventListener('click', del);
  document.querySelector('[data-action="equals"]').addEventListener('click', equals);
  document.querySelector('[data-action="decimal"]').addEventListener('click', ()=> append('.'));
  document.querySelector('[data-action="paren-open"]').addEventListener('click', ()=> append('('));
  document.querySelector('[data-action="paren-close"]').addEventListener('click', ()=> append(')'));
  document.querySelector('[data-action="pi"]').addEventListener('click', ()=> append('\u03c0'));
  document.querySelector('[data-action="euler"]').addEventListener('click', ()=> append('e'));
  document.querySelector('[data-action="log"]').addEventListener('click', ()=> append('log('));
  document.querySelector('[data-action="ln"]').addEventListener('click', ()=> append('ln('));
  document.querySelector('[data-action="sqrt"]').addEventListener('click', ()=> append('sqrt('));
  document.querySelector('[data-action="sq"]').addEventListener('click', ()=> append('^2'));
  document.querySelector('[data-action="cube"]').addEventListener('click', ()=> append('^3'));
  document.querySelector('[data-action="pow"]').addEventListener('click', ()=> append('^'));
  document.querySelector('[data-action="inv"]').addEventListener('click', ()=> append('^(-1)'));
  document.querySelector('[data-action="fact"]').addEventListener('click', ()=> append('!'));
  document.querySelector('[data-action="ans"]').addEventListener('click', ()=> append('Ans'));
  document.querySelector('[data-action="percent"]').addEventListener('click', ()=> append('%'));
  document.querySelector('[data-action="mode"]').addEventListener('click', ()=>{
    degMode = !degMode;
    updateTags();
  });
  document.querySelector('[data-action="negate"]').addEventListener('click', ()=>{
    const m = expr.match(/(\d+\.?\d*)$/);
    if (m){
      const num = m[1];
      const startIdx = expr.length - num.length;
      const before = expr.slice(0, startIdx);
      if (before.endsWith('(-') ){
        expr = before.slice(0, -2) + num;
      } else if (before.endsWith('-') && !/[0-9)\u03c0e!]$/.test(before.slice(0,-1))){
        expr = before.slice(0, -1) + num;       
      } else {
        expr = before + '(-' + num + ')';
      }
      live();
    }
  });

  window.addEventListener('keydown', (e)=>{
    if (e.key >= '0' && e.key <= '9'){ append(e.key); return; }
    if (e.key === '.'){ append('.'); return; }
    if (['+','-','*','/','^','%','(',')','!'].includes(e.key)){ append(e.key); return; }
    if (e.key === 'Enter' || e.key === '='){ e.preventDefault(); equals(); return; }
    if (e.key === 'Backspace'){ del(); return; }
    if (e.key === 'Escape'){ clearAll(); return; }
  });

  render(null);
})();
</script>

</body>
</html>
